# fly.toml app configuration file for the chungus-battles-backend DEV environment
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'chungus-battles-backend-dev'
primary_region = 'arn'

# See fly.toml's matching comment — gives graceful shutdown (onLeave save + onDispose session
# release) a realistic window to finish on deploy instead of hitting fly's 5s default.
kill_signal = 'SIGTERM'
kill_timeout = 30

[build]

[env]
  NODE_ENV = 'development'
  COLYSEUS_SEAT_RESERVATION_TIME = '30'

[http_service]
  internal_port = 2567
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
